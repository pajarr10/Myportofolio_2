<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Access</title>
  <style>
    /* ============================================================
       ROOT VARIABLES – HITAM PUTIH
    ============================================================ */
    :root {
      --bg:            #0a0a0a;
      --line:          #2a2a2a;
      --line-strong:   #3a3a3a;
      --text:          #e0e0e0;
      --text-faint:    #777;
      --text-dim:      #aaa;
      --accent:        #e0e0e0;
      --signal:        #4caf50;
      --danger:        #f44336;
      --radius-sm:     4px;
      --dur-fast:      0.2s;
    }

    /* ============================================================
       GLOBAL RESET
    ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 40px;
    }

    .contact-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .contact-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 18px 20px;
      background: var(--bg);
    }

    .contact-index {
      font-size: 12px;
      color: var(--text-faint);
    }

    .contact-name {
      font-size: 14px;
      font-weight: 500;
    }

    .contact-link {
      grid-column: 2;
      color: var(--text-dim);
      font-size: 13px;
      word-break: break-word;
      transition: color var(--dur-fast);
      text-decoration: none;
    }

    .contact-link:hover,
    .contact-link:focus-visible {
      color: var(--accent);
    }

    .contact-open {
      grid-column: 3;
      grid-row: 1/3;
      justify-self: end;

      font-size: 11px;
      padding: 4px 10px;

      color: var(--signal);
      border: 1px solid currentColor;
      border-radius: var(--radius-sm);

      white-space: nowrap;
    }

    /* =======================================================
       ROLE SELECTION (SUPERADMIN / ADMIN)
    ======================================================= */
    .role-selection {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .role-option {
      position: relative;
    }

    .role-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .role-card {
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color var(--dur-fast), background var(--dur-fast);
    }

    .role-card:hover {
      border-color: var(--text-dim);
    }

    .role-option input[type="radio"]:checked + .role-card {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.03);
    }

    .role-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .role-title::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid var(--text-faint);
    }

    .role-option input[type="radio"]:checked + .role-card .role-title::after {
      background: var(--accent);
      border-color: var(--accent);
    }

    .role-desc {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 4px;
    }

    /* =======================================================
       CONTACT FORM / LOGIN FORM
    ======================================================= */

    .contact-form-wrap {
      width: 100%;
      margin-top: 48px;
      padding-top: 36px;
      border-top: 1px solid var(--line);
    }

    .contact-form-tag {
      margin: 0 0 20px;
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .contact-form {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .contact-form-input {
      width: 100%;
      padding: 15px 18px;

      background: var(--bg);
      color: var(--text);

      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);

      font: inherit;
      line-height: 1.6;

      transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;

      box-sizing: border-box;
    }

    .contact-form-input::placeholder {
      color: var(--text-faint);
    }

    .contact-form-input:hover {
      border-color: var(--text-dim);
    }

    .contact-form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .05);
    }

    .contact-form-textarea {
      grid-column: 1/-1;
      min-height: 180px;
      resize: vertical;
    }

    .contact-form-submit {
      grid-column: 1/-1;

      display: inline-flex;
      justify-content: center;
      align-items: center;

      width: 100%;
      min-height: 52px;

      border: none;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .05em;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity var(--dur-fast);
    }

    .contact-form-submit:hover {
      opacity: 0.85;
    }

    .contact-form-submit:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .contact-form-status {
      grid-column: 1/-1;

      min-height: 18px;
      margin: 0;

      font-size: 12px;
      color: var(--text-dim);
    }

    .contact-form-status.is-success {
      color: var(--signal);
    }

    .contact-form-status.is-error {
      color: var(--danger);
    }

    .hint {
      grid-column: 1/-1;
      text-align: center;
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 8px;
      letter-spacing: .06em;
    }

    .hint span {
      color: #fff;
      font-weight: bold;
      background: rgba(255, 255, 255, .08);
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, .15);
    }

    /* ============================================================
       OVERLAY VIDEO
    ============================================================ */
    #videoOverlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 999999;
      display: none;
      overflow: hidden;
      cursor: none;
    }

    #videoOverlay video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1);
    }

    /* =======================================================
       RESPONSIVE BREAKPOINTS
    ======================================================= */

    @media (max-width: 900px) {
      .contact-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .contact-form {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .role-selection {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .contact-form-textarea,
      .contact-form-submit,
      .contact-form-status {
        grid-column: auto;
      }

      .contact-form-input {
        padding: 14px 15px;
        font-size: 16px;
      }

      .contact-form-textarea {
        min-height: 150px;
      }

      .contact-form-submit {
        width: 100%;
      }

      .contact-row {
        grid-template-columns: 22px 1fr;
        gap: 10px;
      }

      .contact-open {
        grid-column: 2;
        grid-row: auto;
        justify-self: start;
        margin-top: 8px;
      }
    }

    @media (max-width: 480px) {
      .contact-row {
        padding: 16px;
      }

      .contact-name {
        font-size: 13px;
      }

      .contact-link {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LIST ELEMEN PERTAMA -->
    <div class="contact-list">
      <div class="contact-row">
        <div class="contact-index">01</div>
        <div class="contact-name">System Administration</div>
        <a href="#" class="contact-link">admin.system@local</a>
        <div class="contact-open">[LOCKED]</div>
      </div>

      <div class="contact-row">
        <div class="contact-index">02</div>
        <div class="contact-name">Security Gateway</div>
        <a href="#" class="contact-link">security.auth@local</a>
        <div class="contact-open">[ACTIVE]</div>
      </div>
    </div>

    <!-- WRAPPER FORM UTAMA -->
    <div class="contact-form-wrap">
      <div class="contact-form-tag">// PILIH ROLE & VERIFIKASI HAK AKSES PANEL</div>

      <form id="loginForm" class="contact-form" onsubmit="return false;">
        
        <!-- PILIHAN ROLE (SUPERADMIN & ADMIN) -->
        <div class="role-selection">
          <label class="role-option">
            <input type="radio" name="userRole" value="superadmin" checked>
            <div class="role-card">
              <span class="role-title">SUPERADMIN</span>
              <span class="role-desc">Akses penuh ke seluruh sistem</span>
            </div>
          </label>

          <label class="role-option">
            <input type="radio" name="userRole" value="admin">
            <div class="role-card">
              <span class="role-title">ADMIN</span>
              <span class="role-desc">Akses standar manajemen data</span>
            </div>
          </label>
        </div>

        <input 
          type="password" 
          id="adminKeyInput" 
          class="contact-form-input" 
          style="grid-column: 1 / -1;"
          placeholder="Masukkan Admin Key..."
          autofocus
        >

        <button type="button" id="loginBtn" class="contact-form-submit">
          AKSES ADMIN PANEL
        </button>

        <div id="loginStatus" class="contact-form-status"></div>

        <div class="hint">
          key rahasia: <span>admin123</span>
        </div>

      </form>
    </div>

  </div>

  <!-- OVERLAY VIDEO -->
  <div id="videoOverlay">
    <video id="prankVideo" loop playsinline src="https://c.termai.cc/v127/mZZUWSX.mp4"></video>
  </div>

  <!-- SCRIPT TIDAK DIUBAH -->
  <script>
    (function() {
      "use strict";

      const input   = document.getElementById('adminKeyInput');
      const btn     = document.getElementById('loginBtn');
      const status  = document.getElementById('loginStatus');

      const overlay = document.getElementById('videoOverlay');
      const video   = document.getElementById('prankVideo');

      let isPrankActive = false;

      // ===== START PRANK =====
      function startPrank() {
        if (isPrankActive) return;
        isPrankActive = true;

        overlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }

        if (document.body.requestPointerLock) {
          document.body.requestPointerLock().catch(() => {});
        }

        document.addEventListener('click', function lockPointer() {
          if (document.pointerLockElement !== document.body) {
            document.body.requestPointerLock().catch(() => {});
          }
        });

        if (video) {
          video.play().catch(() => {});
        }
      }

      // ===== CLOSE PRANK =====
      function closePrank() {
        if (!isPrankActive) return;
        isPrankActive = false;

        overlay.style.display = 'none';
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';

        if (video) {
          video.pause();
          video.currentTime = 0;
        }

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        if (document.pointerLockElement) {
          document.exitPointerLock().catch(() => {});
        }

        status.textContent = '';
        status.className = 'contact-form-status';
        input.value = '';
        input.focus();
      }

      // ===== ATTEMPT LOGIN =====
      function attemptLogin() {
        const key = input.value.trim();

        if (key === 'admin123') {
          status.textContent = 'Akses diberikan, mengalihkan...';
          status.className = 'contact-form-status is-success';
          startPrank();
        } else {
          status.textContent = 'Key salah! Silahkan periksa kembali key Anda.';
          status.className = 'contact-form-status is-error';
          input.value = '';
          input.focus();
        }
      }

      btn.addEventListener('click', attemptLogin);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          attemptLogin();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isPrankActive) {
          closePrank();
        }
      });

      document.addEventListener('wheel', function(e) {
        if (overlay.style.display === 'block') e.preventDefault();
      }, { passive: false });
      
      document.addEventListener('touchmove', function(e) {
        if (overlay.style.display === 'block') e.preventDefault();
      }, { passive: false });

      input.focus();
    })();
  </script>

</body>
</html>
